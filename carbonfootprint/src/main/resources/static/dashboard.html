<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack AI - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark-theme dashboard-body">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand text-gradient fw-bold" href="#">EcoTrack AI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link text-light" id="welcomeMessage">Welcome, User</span>
                    </li>
                    <li class="nav-item">
                        <button id="logoutBtn" class="btn btn-outline-danger btn-sm ms-3 mt-1">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 animate-slide-up">
        
        <!-- Summary Cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="glass-card stat-card p-4 text-center">
                    <h5 class="text-light">Total Carbon Footprint</h5>
                    <h2 class="text-gradient fw-bold mt-3"><span id="totalFootprint">0.00</span> kg</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title">Total Points</h5>
                        <h2 class="display-4" id="totalPoints">0</h2>
                        <button class="btn btn-light mt-2" id="downloadPdfBtn">Download PDF Report</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <canvas id="emissionsPieChart"></canvas>
            </div>
            <div class="col-md-6">
                <canvas id="emissionsBarChart"></canvas>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="row g-4">
            
            <!-- Add Activity Form -->
            <div class="col-lg-5">
                <div class="glass-card p-4 h-100">
                    <h4 class="text-light mb-4">Log Activity</h4>
                    
                    <ul class="nav nav-pills mb-3 custom-pills" id="activity-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#transport-tab" type="button">Transport</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#energy-tab" type="button">Energy</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="activity-content">
                        <!-- Transport Form -->
                        <div class="tab-pane fade show active" id="transport-tab">
                            <form id="transportForm">
                                <div class="mb-3">
                                    <label class="form-label text-light">Type</label>
                                    <select class="form-select glass-input" id="transportType" required>
                                        <option value="car">Car</option>
                                        <option value="bike">Bike</option>
                                        <option value="bus">Bus</option>
                                        <option value="train">Train</option>
                                        <option value="flight">Flight</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-light">Distance (km)</label>
                                    <input type="number" class="form-control glass-input" id="transportDistance" step="0.1" required>
                                </div>
                                <button type="submit" class="btn btn-primary-gradient w-100">Log Transport</button>
                            </form>
                        </div>

                        <!-- Energy Form -->
                        <div class="tab-pane fade" id="energy-tab">
                            <form id="energyForm">
                                <div class="mb-4">
                                    <label class="form-label text-light">Electricity Used (kWh)</label>
                                    <input type="number" class="form-control glass-input" id="electricityKwh" step="0.1" required>
                                </div>
                                <button type="submit" class="btn btn-primary-gradient w-100">Log Energy</button>
                            </form>
                        </div>
                    </div>

                    <div id="activityMessage" class="mt-3 text-light text-center"></div>

                </div>
            </div>

            <!-- Recommendations & Chart -->
            <div class="col-lg-7">
                <div class="glass-card p-4 mb-4">
                    <h4 class="text-light mb-3">AI Recommendations</h4>
                    <ul id="recommendationsList" class="list-group list-group-flush bg-transparent">
                        <li class="list-group-item bg-transparent text-light border-0">Loading...</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
