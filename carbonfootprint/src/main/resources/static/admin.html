<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack AI - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark-theme dashboard-body">

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand text-gradient fw-bold" href="#">EcoTrack AI Admin</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button id="adminLogoutBtn" class="btn btn-outline-danger btn-sm ms-3 mt-1">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 animate-slide-up">
        
        <h2 class="text-light mb-4">System Overview</h2>
        
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="glass-card stat-card p-4 text-center">
                    <h5 class="text-light">Total Users</h5>
                    <h2 class="text-gradient fw-bold mt-3"><span id="adminTotalUsers">0</span></h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card stat-card p-4 text-center">
                    <h5 class="text-light">Total Platform Emissions</h5>
                    <h2 class="text-gradient fw-bold mt-3"><span id="adminTotalCarbon">0.00</span> kg</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card stat-card p-4 text-center">
                    <h5 class="text-light">Avg Emission/User</h5>
                    <h2 class="text-gradient fw-bold mt-3"><span id="adminAvgCarbon">0.00</span> kg</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="glass-card p-4">
                    <h4 class="text-light mb-4">User Management</h4>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-borderless bg-transparent">
                            <thead>
                                <tr class="text-muted border-bottom border-secondary">
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Points</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Users injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
