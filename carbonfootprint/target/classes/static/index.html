<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack AI - Smart Carbon Footprint Tracking</title>
    <!-- Bootstrap CSS for layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark-theme">
    
    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="glass-card text-center p-5 animate-fade-in">
            <h1 class="text-gradient display-4 fw-bold mb-3">EcoTrack AI</h1>
            <p class="text-light mb-5 fs-5">Track your carbon footprint. Save the planet. Earn rewards.</p>
            
            <div id="auth-forms">
                <!-- Login Form -->
                <div id="login-section" class="auth-section active">
                    <form id="loginForm" class="text-start">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label text-light">Username</label>
                            <input type="text" class="form-control glass-input" id="loginUsername" required>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label text-light">Password</label>
                            <input type="password" class="form-control glass-input" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary-gradient w-100 mb-3">Log In</button>
                        <p class="text-light text-center">New here? <a href="#" id="showSignup" class="text-highlight">Create an account</a></p>
                    </form>
                </div>

                <!-- Signup Form -->
                <div id="signup-section" class="auth-section">
                    <form id="signupForm" class="text-start">
                        <div class="mb-3">
                            <label for="signupUsername" class="form-label text-light">Username</label>
                            <input type="text" class="form-control glass-input" id="signupUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="signupEmail" class="form-label text-light">Email</label>
                            <input type="email" class="form-control glass-input" id="signupEmail" required>
                        </div>
                        <div class="mb-4">
                            <label for="signupPassword" class="form-label text-light">Password</label>
                            <input type="password" class="form-control glass-input" id="signupPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary-gradient w-100 mb-3">Sign Up</button>
                        <p class="text-light text-center">Already have an account? <a href="#" id="showLogin" class="text-highlight">Log In</a></p>
                    </form>
                </div>
            </div>
            
            <div id="authMessage" class="mt-3 text-light"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
